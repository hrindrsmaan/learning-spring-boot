spring.application.name=02-rest-crud-jpa

# In-memory H2 database (data resets on every restart)
spring.datasource.url=jdbc:h2:mem:company
spring.datasource.username=sa
spring.datasource.password=

# Hibernate creates the employee table from the Employee class
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

# Run data.sql AFTER Hibernate has created the tables
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# H2 web console at http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
